<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="auth.forgotPasswordPageTitle">Forgot Password | PulseMD - Virtual Clinic</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="care-auth-page care-login-page">
  <main class="care-login-shell single-auth-shell">
    <section class="care-login-card">
      <a class="care-login-card-brand" href="/index.html" aria-label="PulseMD - Virtual Clinic home" data-i18n-aria-label="home.brandAria">
        <span class="care-login-logo" aria-hidden="true">
          <span><span>Pulse</span><span>MD</span></span>
        </span>
        <div>
          <strong data-i18n="home.brandName">PulseMD - Virtual Clinic</strong>
          <span data-i18n="home.tagline">Healthcare that comes to you</span>
        </div>
      </a>

      <div class="care-login-heading">
        <span data-i18n="auth.passwordHelp">Password help</span>
        <h1 data-i18n="auth.forgotPassword">Forgot password?</h1>
        <p data-i18n="auth.forgotPasswordSubtitle">Enter your registered email and we will send a secure reset link.</p>
      </div>

      <form class="care-login-form" onsubmit="submitForgotPassword(event)">
        <label data-i18n="phrases.Email">Email
          <span class="care-login-input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="m4 7 8 6 8-6"></path></svg>
            <input type="email" name="email" required autocomplete="email" placeholder="you@example.com" data-i18n-placeholder="auth.emailPlaceholder">
          </span>
        </label>
        <p id="forgotPasswordMessage" class="auth-message" role="status" aria-live="polite"></p>
        <button type="submit" data-i18n="auth.sendResetLink">Send reset link</button>
        <a class="button secondary" href="/login.html" data-i18n="auth.backToLogin">Back to login</a>
      </form>
    </section>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
