<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="auth.resetPasswordPageTitle">Reset Password | PulseMD - Virtual Clinic</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="care-auth-page care-login-page">
  <main class="care-login-shell single-auth-shell">
    <section class="care-login-card">
      <a class="care-login-card-brand" href="/index.html" aria-label="PulseMD - Virtual Clinic home" data-i18n-aria-label="home.brandAria">
        <span class="care-login-logo" aria-hidden="true">
          <span><span>Pulse</span><span>MD</span></span>
        </span>
        <div>
          <strong data-i18n="home.brandName">PulseMD - Virtual Clinic</strong>
          <span data-i18n="home.tagline">Healthcare that comes to you</span>
        </div>
      </a>

      <div class="care-login-heading">
        <span data-i18n="auth.secureReset">Secure reset</span>
        <h1 data-i18n="auth.createNewPassword">Create new password</h1>
        <p data-i18n="auth.createNewPasswordSubtitle">Choose a strong password to protect your consultations, prescriptions, and health records.</p>
      </div>

      <form class="care-login-form" onsubmit="submitResetPassword(event)">
        <input id="resetTokenInput" type="hidden" name="token">
        <label data-i18n="auth.newPassword">New password
          <span class="care-login-input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            <input id="resetPassword" type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Enter new password" data-i18n-placeholder="auth.newPasswordPlaceholder">
            <button type="button" class="care-password-toggle" onclick="togglePassword('resetPassword', this)" data-i18n="auth.show">Show</button>
          </span>
        </label>
        <label data-i18n="auth.confirmPassword">Confirm password
          <span class="care-login-input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            <input id="resetConfirmPassword" type="password" name="confirmPassword" required minlength="6" autocomplete="new-password" placeholder="Confirm new password" data-i18n-placeholder="auth.confirmPasswordPlaceholder">
          </span>
        </label>
        <p id="resetPasswordMessage" class="auth-message" role="status" aria-live="polite"></p>
        <button type="submit" data-i18n="auth.updatePassword">Update password</button>
        <a class="button secondary" href="/login.html" data-i18n="auth.backToLogin">Back to login</a>
      </form>
    </section>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
