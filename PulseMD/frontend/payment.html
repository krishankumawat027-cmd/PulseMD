<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments | PulseMD - Virtual Clinic</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body onload="initPaymentPage()">
  <main class="container">
    <section class="page-head">
      <div>
        <h1 data-i18n="payments.title">Consultation payment</h1>
        <p class="muted" data-i18n="payments.subtitle">Razorpay-ready payment flow for India.</p>
      </div>
    </section>

    <section class="payment-layout">
      <article class="card payment-panel">
        <p class="eyebrow" data-i18n="payments.secureCheckout">Secure checkout</p>
        <h2 data-i18n="payments.summary">Consultation summary</h2>
        <div id="paymentDetails" class="status-line" data-i18n="payments.choosePending">Choose a pending appointment.</div>
        <div class="payment-methods">
          <label class="payment-method-card selected"><input type="radio" name="method" checked> <span data-i18n="payments.upi">UPI / Razorpay</span></label>
          <label class="payment-method-card"><input type="radio" name="method"> <span data-i18n="payments.card">Card</span></label>
          <label class="payment-method-card"><input type="radio" name="method"> <span data-i18n="payments.netBanking">Net banking</span></label>
          <label class="payment-method-card"><input type="radio" name="method"> <span data-i18n="payments.wallet">Wallet</span></label>
        </div>
        <div class="actions">
          <button id="payNowBtn" onclick="payNow()" disabled data-i18n="buttons.payNow">Pay Now</button>
        </div>
        <p id="paymentStatus" class="status-line"></p>
      </article>

      <article class="card table-wrap payment-panel">
        <p class="eyebrow" data-i18n="payments.history">History</p>
        <h2 data-i18n="payments.paymentHistory">Payment history</h2>
        <table>
          <thead>
            <tr>
              <th data-i18n="labels.doctor">Doctor</th>
              <th data-i18n="labels.amount">Amount</th>
              <th data-i18n="labels.status">Status</th>
              <th data-i18n="labels.date">Date</th>
            </tr>
          </thead>
          <tbody id="paymentsBody"></tbody>
        </table>
      </article>
    </section>
  </main>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/payment.js"></script>
</body>
</html>
