<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="doctor.patientsPageTitle">Patients | PulseMD - Virtual Clinic</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="doctor-layout doctor-app" onload="initDoctorPatients()">
  <main class="doctor-main">
    <section class="container">
      <div class="page-head">
        <div>
          <h1 data-i18n="phrases.Incoming patients">Incoming patients</h1>
          <p class="muted" data-i18n="doctor.incomingPatientsSubtitle">Accept chat or video requests from booked patients.</p>
        </div>
      </div>
      <section id="patientsList" class="grid"></section>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/doctor.js"></script>
</body>
</html>
